# Temporary: CRYPTAGION SARIF line-hash verification. Do not merge.
name: cryptagion-linehash
on: pull_request
permissions:
  contents: read
  security-events: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: cryptagion.sarif
          category: cryptagion
